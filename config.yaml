audit:
  stale_after_days: 30       # leads audited more recently than this are skipped on incremental runs
  concurrency: 5
  per_host_min_interval_s: 1.5
  request_timeout_s: 15
  max_html_bytes: 2000000
  user_agent: "MonkPressSiteCheck/1.0 (+https://themonkpress.com; one-person local web studio; polite single-page check)"
  robots_user_agent: MonkPressSiteCheck
  run_pagespeed: true
  pagespeed_timeout_s: 90
  pagespeed_concurrency: 3
  screenshots: true
  screenshot_device: "iPhone 13"
  screenshot_concurrency: 2
  chromium_executable: null      # set to a Chrome/Chromium path if `playwright install chromium` isn't an option
  copyright_stale_age_years: 6   # 2026 - 6 = 2020, so ©2019 or earlier is flagged
  old_wordpress_major: 6         # WordPress < 6.x is flagged as out of date
  social_domains: [facebook.com, fb.com, fb.me, m.facebook.com, instagram.com, linktr.ee, tiktok.com, yelp.com, x.com, twitter.com]
  dead_platform_domains: [business.site]   # Google's free Business Profile sites were shut down in 2024

scoring:
  weights:
    no_website: 60
    social_only: 45
    broken_site: 55
    poor_mobile_speed: 25        # PageSpeed mobile performance below poor_speed_below
    mediocre_mobile_speed: 10    # below mediocre_speed_below
    no_https: 12
    ssl_invalid: 15
    no_https_redirect: 3
    no_viewport: 15
    stale_copyright: 10
    outdated_platform: 10
    old_wordpress: 8
    outdated_markup: 10
    missing_title_or_description: 5
    no_tel_link: 6
    no_contact_form: 4
    no_hours: 4
    no_map: 2
    reputation_bonus: 12         # strong Google reputation AND a weak/missing site
    category_fit_high: 8
    category_fit_medium: 4
    category_fit_low: 0
    low_review_penalty: -5       # fewer than low_review_count reviews: may be inactive
    temporarily_closed_penalty: -15
  reputation_min_rating: 4.3
  reputation_min_reviews: 25
  weak_site_threshold: 20        # site-problem points at or above this count as a "weak site"
  poor_speed_below: 50
  mediocre_speed_below: 70
  distance_free_miles: 5
  distance_penalty_per_mile: 0.5
  distance_penalty_max: 15
  low_review_count: 3
  custom_min_reviews: 200        # busy business + booking/ordering integrations => suggest Custom
  standard_min_reviews: 50       # established service business => suggest Standard over Starter

sender:                          # used in every draft; CAN-SPAM requires a real identity and postal address
  name: Jeremy Monk
  business: The Monk Press
  website: https://themonkpress.com
  email: ""                      # fill in
  phone: ""                      # fill in
  physical_address: ""           # REQUIRED before email drafts are generated (street or registered PO box)
  home_area: Rensselaer County

llm:
  enabled: false                 # or pass --llm on the command line
  model: claude-opus-5-5
  effort: low
  max_concurrency: 3
  est_input_tokens: 900          # used only for the pre-run cost estimate
  est_output_tokens: 600
  price_input_per_mtok: 4.00
  price_output_per_mtok: 20.00

costs:
  # Requesting website, phone, rating and hours puts Places calls in the "Enterprise" SKU.
  # Verify current prices at https://developers.google.com/maps/billing-and-pricing/pricing
  places_text_search_per_1000: 35.00
  places_nearby_search_per_1000: 35.00
  confirm_over_usd: 5.00          # ask before any run estimated above this

cache:
  places_ttl_days: 30
  pagespeed_ttl_days: 7
  llm_ttl_days: 90

output:
  data_dir: data                 # relative paths resolve against this config file's folder
  suppression_file: suppression.txt
  report_top_n: 25
