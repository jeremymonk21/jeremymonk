# The Monk Press lead finder configuration.
# Every number that affects cost or scoring lives here so it can be tuned without code changes.

# ---------------------------------------------------------------------------
# Where to look. Coordinates are approximate town centers.
# `extended: true` towns (Albany / Saratoga counties) are only searched when
# discovery.include_extended_area is true or --extended is passed.
# ---------------------------------------------------------------------------
towns:
  - { name: Troy,                   lat: 42.7284, lng: -73.6918, radius_km: 6 }
  - { name: Rensselaer,             lat: 42.6426, lng: -73.7429, radius_km: 4 }
  - { name: East Greenbush,         lat: 42.5906, lng: -73.7032, radius_km: 6 }
  - { name: North Greenbush,        lat: 42.6728, lng: -73.6668, radius_km: 6 }
  - { name: Brunswick,              lat: 42.7495, lng: -73.5880, radius_km: 7 }
  - { name: Schodack,               lat: 42.5420, lng: -73.6800, radius_km: 8 }
  - { name: Castleton-on-Hudson,    lat: 42.5187, lng: -73.7512, radius_km: 3 }
  - { name: Hoosick Falls,          lat: 42.9006, lng: -73.3515, radius_km: 5 }
  - { name: Sand Lake,              lat: 42.6365, lng: -73.5404, radius_km: 7 }
  - { name: Averill Park,           lat: 42.6353, lng: -73.5537, radius_km: 4 }
  - { name: Nassau,                 lat: 42.5156, lng: -73.6101, radius_km: 6 }
  - { name: Poestenkill,            lat: 42.6901, lng: -73.5640, radius_km: 6 }
  - { name: Schaghticoke,           lat: 42.9000, lng: -73.5900, radius_km: 7 }
  - { name: Valley Falls,           lat: 42.9006, lng: -73.5637, radius_km: 3 }
  - { name: Pittstown,              lat: 42.8600, lng: -73.5000, radius_km: 8 }
  - { name: Grafton,                lat: 42.7700, lng: -73.4500, radius_km: 8 }
  - { name: Berlin,                 lat: 42.6900, lng: -73.3700, radius_km: 8 }
  - { name: Stephentown,            lat: 42.5500, lng: -73.3800, radius_km: 8 }
  - { name: Petersburgh,            lat: 42.7500, lng: -73.3400, radius_km: 7 }
  # Optional radius into Albany and Saratoga counties
  - { name: Albany,           county: Albany,   lat: 42.6526, lng: -73.7562, radius_km: 6, extended: true }
  - { name: Cohoes,           county: Albany,   lat: 42.7742, lng: -73.7001, radius_km: 4, extended: true }
  - { name: Watervliet,       county: Albany,   lat: 42.7301, lng: -73.7012, radius_km: 3, extended: true }
  - { name: Colonie,          county: Albany,   lat: 42.7179, lng: -73.8335, radius_km: 7, extended: true }
  - { name: Waterford,        county: Saratoga, lat: 42.7926, lng: -73.6812, radius_km: 4, extended: true }
  - { name: Mechanicville,    county: Saratoga, lat: 42.9028, lng: -73.6873, radius_km: 4, extended: true }
  - { name: Clifton Park,     county: Saratoga, lat: 42.8656, lng: -73.7710, radius_km: 7, extended: true }

# ---------------------------------------------------------------------------
# What to look for. `query` is sent to Places Text Search as "<query> in <town>, NY".
# group: food | beauty | trades | auto | retail | services | other  (drives tier suggestions)
# fit:   high | medium | low                                          (drives the category bonus)
# place_types are only used when discovery.mode is "nearby".
# ---------------------------------------------------------------------------
categories:
  - { key: restaurant,  query: restaurant,           group: food,     fit: high,   place_types: [restaurant] }
  - { key: cafe,        query: cafe,                 group: food,     fit: high,   place_types: [cafe, coffee_shop] }
  - { key: bakery,      query: bakery,               group: food,     fit: high,   place_types: [bakery] }
  - { key: pizza,       query: pizza,                group: food,     fit: high,   place_types: [pizza_restaurant] }
  - { key: salon,       query: hair salon,           group: beauty,   fit: high,   place_types: [hair_salon, beauty_salon] }
  - { key: barber,      query: barber shop,          group: beauty,   fit: high,   place_types: [barber_shop] }
  - { key: nail_salon,  query: nail salon,           group: beauty,   fit: medium, place_types: [nail_salon] }
  - { key: contractor,  query: general contractor,   group: trades,   fit: high,   place_types: [general_contractor] }
  - { key: plumber,     query: plumber,              group: trades,   fit: high,   place_types: [plumber] }
  - { key: electrician, query: electrician,          group: trades,   fit: high,   place_types: [electrician] }
  - { key: roofer,      query: roofing contractor,   group: trades,   fit: high,   place_types: [roofing_contractor] }
  - { key: landscaper,  query: landscaping service,  group: trades,   fit: high,   place_types: [] }
  - { key: auto_repair, query: auto repair shop,     group: auto,     fit: high,   place_types: [car_repair] }
  - { key: retail,      query: gift shop,            group: retail,   fit: medium, place_types: [gift_shop, store] }
  - { key: florist,     query: florist,              group: retail,   fit: medium, place_types: [florist] }
  - { key: boutique,    query: clothing boutique,    group: retail,   fit: medium, place_types: [clothing_store] }
  - { key: pet_groomer, query: pet groomer,          group: services, fit: medium, place_types: [pet_care] }
  - { key: cleaning,    query: cleaning service,     group: services, fit: medium, place_types: [] }

discovery:
  mode: text                 # "text" (Text Search, paginated) or "nearby" (Nearby Search by place type)
  max_pages_per_query: 2     # 1-3; each page is up to 20 results and is billed as one request
  page_size: 20
  include_extended_area: false
  origin: Troy               # distances are measured from this town
  max_distance_miles: 30     # results farther than this from the origin are dropped
  concurrency: 4
  region_code: us

chains:
  min_locations: 3           # same name at this many different addresses => treated as a chain
  locator_url_patterns: ["/locations/", "/location/", "/stores/", "/store/", "storelocator", "store-locator", "/find-a-", "locations."]
  blocklist:
    - McDonald's
    - Burger King
    - Wendy's
    - Taco Bell
    - Subway
    - Dunkin
    - Starbucks
    - Stewart's Shops
    - Cumberland Farms
    - Domino's
